<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Screen Share Bas1cDark App: a curated suite of Windows forensic tools including OrbDiff, Spokwn, NirSoft, and more.">
<title>Screen Share Bas1cDark App v1</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0c; --panel:#0f0f12; --panel-2:#141418; --line:#1c1c22; --line-2:#26262e;
  --text:#ececf0; --muted:#8b8b96; --dim:#5b5b66;
  --accent:#ff2d46; --accent-2:#b3122a; --accent-soft:rgba(255,45,70,.12); --accent-line:rgba(255,45,70,.38);
  --ok:#22c55e;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#app{width:100%;height:100%;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;animation:fadeIn .5s ease-out;
  background:radial-gradient(900px 400px at 85% -10%,rgba(255,45,70,.07),transparent 60%),var(--bg)}

/* title bar */
.drag-handle{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 12px;background:#0c0c0f;border-bottom:1px solid var(--line);cursor:default;flex-shrink:0}
.drag-title{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.4px}
.drag-title .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.drag-title b{color:var(--text);font-weight:600}
.win-btns{display:flex;align-items:center;gap:4px}
.win-btns .wb{display:flex;align-items:center;justify-content:center;width:28px;height:22px;border-radius:5px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.win-btns .wb:hover{background:#1b1b21;color:var(--text)}
.win-btns .wb.close:hover{background:var(--accent-2);color:#fff}

/* layout */
.shell{display:flex;flex:1;min-height:0}
.sidebar{width:208px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 4px 18px rgba(255,45,70,.35)}
.brand .t1{font-size:14px;font-weight:700;letter-spacing:.2px}
.brand .t2{font-size:10.5px;color:var(--muted);margin-top:1px}
.nav-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);padding:10px 10px 6px;font-weight:600}
.tab-bar{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;font-size:12.5px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-family:inherit;text-align:left;position:relative}
.tab-btn svg{flex-shrink:0;opacity:.85}
.tab-btn .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab-btn .cnt{font-size:10px;color:var(--dim);background:#17171c;border-radius:10px;padding:1px 7px;min-width:22px;text-align:center}
.tab-btn:hover{background:#15151a;color:var(--text)}
.tab-btn.active{background:var(--accent-soft);color:#fff;border-color:var(--accent-line)}
.tab-btn.active svg{color:var(--accent);opacity:1}
.tab-btn.active .cnt{background:rgba(255,45,70,.2);color:#ffb3bd}
.tab-btn.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tab-btn.featured .lbl{font-weight:600;color:#fff}
.tab-btn.featured svg{color:var(--accent)}
.tab-btn.featured:not(.active){background:linear-gradient(90deg,rgba(255,45,70,.10),transparent);}
.side-foot{padding:10px 8px 0;border-top:1px solid var(--line);margin-top:8px;font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between}
.side-foot span b{color:var(--muted);font-weight:600}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px 14px;flex-shrink:0}
.content-header .titles{min-width:0}
.content-header h1{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content-header h1 span{color:var(--muted);font-weight:400}
.content-header .sub{font-size:11.5px;color:var(--dim);margin-top:3px}
.header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;color:var(--dim);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);color:var(--accent)}
.search input{background:transparent;border:none;outline:none;color:var(--text);font-size:12px;width:150px;font-family:inherit;user-select:text;-webkit-user-select:text}
.search input::placeholder{color:var(--dim)}
.btn-dl-all{display:flex;align-items:center;gap:6px;height:32px;font-size:12px;font-weight:500;padding:0 14px;border:1px solid var(--accent-line);border-radius:8px;background:var(--accent-soft);color:#ff8a99;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-dl-all:hover{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 18px rgba(255,45,70,.3)}

.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:2px 22px 28px;min-height:0;flex:1;overflow-y:auto;align-content:start;scrollbar-width:thin;scrollbar-color:#3a1218 transparent}
.tool-grid::-webkit-scrollbar{width:8px}
.tool-grid::-webkit-scrollbar-track{background:transparent}
.tool-grid::-webkit-scrollbar-thumb{background:#2a1015;border-radius:6px;border:2px solid var(--bg);background-clip:padding-box}
.tool-grid::-webkit-scrollbar-thumb:hover{background:#4a1520;background-clip:padding-box}

.tool-card{position:relative;border-radius:12px;padding:14px;min-height:112px;border:1px solid var(--line);cursor:pointer;background:linear-gradient(180deg,#121216,#0e0e11);
  display:flex;flex-direction:column;gap:10px;overflow:hidden;animation:cardIn .35s ease-out both;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.tool-card:hover{border-color:var(--accent-line);background:linear-gradient(180deg,#17121a,#110e12);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(255,45,70,.06)}
.tool-card:active{transform:translateY(0)}
.card-top{display:flex;align-items:center;gap:10px;padding-right:14px}
.avatar{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#ffb3bd;letter-spacing:.3px;
  background:linear-gradient(135deg,rgba(255,45,70,.22),rgba(255,45,70,.05));border:1px solid rgba(255,45,70,.22)}
.tool-card .name{font-size:13px;font-weight:600;color:var(--text);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tool-card .desc{font-size:11.5px;color:var(--muted);line-height:1.45;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card-foot{display:flex;align-items:center;justify-content:space-between}
.chip{font-size:9.5px;font-weight:600;letter-spacing:.8px;color:var(--muted);background:#18181d;border:1px solid var(--line-2);border-radius:5px;padding:2px 6px}
.chip.ps{color:#8ab4ff;border-color:rgba(138,180,255,.25);background:rgba(138,180,255,.07)}
.go{display:flex;align-items:center;color:var(--dim);transition:color .15s,transform .15s}
.tool-card:hover .go{color:var(--accent);transform:translateX(2px)}

.tool-card .progress-wrap{position:absolute;bottom:0;left:0;right:0;height:3px;background:transparent;overflow:hidden}
.tool-card .progress-bar{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .3s;width:0;border-radius:0 3px 3px 0}
.tool-card .progress-bar.indeterminate{width:35%!important;animation:indeterminate 1.3s ease-in-out infinite}
.tool-card .cooldown-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);backdrop-filter:blur(3px)}
.tool-card .dl-indicator{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:#2a2a32}
.tool-card .dl-indicator.downloaded{background:var(--ok);box-shadow:0 0 8px rgba(34,197,94,.6)}
.tool-card .dl-indicator.downloading{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes indeterminate{0%{transform:translateX(-100%)}50%{transform:translateX(200%)}100%{transform:translateX(400%)}}

/* toasts */
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px)}}
#toast-stack{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;max-width:290px}
.dl-toast{pointer-events:auto;background:#121216;border:1px solid var(--line-2);border-left:3px solid #d99a3f;border-radius:8px;padding:8px 12px;font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .18s ease-out;overflow:hidden}
.dl-toast.closing{animation:toastOut .18s ease-in forwards}
.dl-toast .dl-toast-text{color:#d4d4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-toast .dl-toast-tag{font-weight:600;margin-right:4px}
.dl-toast.downloading .dl-toast-tag{color:#e0a83f}
.dl-toast.downloading .dl-toast-bar{margin-top:6px;height:3px;background:#1c1c22;border-radius:2px;overflow:hidden}
.dl-toast.downloading .dl-toast-fill{height:100%;background:linear-gradient(90deg,#e0a83f,#d97b3f);border-radius:2px;transition:width .25s;width:0}
.dl-toast.downloading .dl-toast-fill.indeterminate{width:30%!important;animation:indeterminate 1.3s ease-in-out infinite}
.dl-toast.success{border-left-color:var(--ok)}
.dl-toast.success .dl-toast-tag{color:var(--ok)}
.dl-toast.error{border-left-color:var(--accent)}
.dl-toast.error .dl-toast-tag{color:var(--accent)}

/* confirm */
#confirm-overlay{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
#confirm-overlay.show{display:flex}
.confirm-dialog{background:#101014;border:1px solid var(--line-2);border-radius:14px;padding:24px;width:380px;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:fadeIn .2s ease-out}
.confirm-dialog h3{font-size:14px;color:var(--text);margin-bottom:8px}
.confirm-dialog p{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.55}
.confirm-buttons{display:flex;justify-content:flex-end;gap:10px}
.confirm-buttons button{font-size:12px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;transition:all .15s;font-family:inherit}
.confirm-buttons .btn-no{background:#1a1a20;color:var(--muted)}
.confirm-buttons .btn-no:hover{background:#24242c;color:var(--text)}
.confirm-buttons .btn-yes{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.confirm-buttons .btn-yes:hover{box-shadow:0 4px 16px rgba(255,45,70,.35)}

.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:260px;color:var(--dim);font-size:13px;gap:8px}
.empty-state svg{opacity:.4;margin-bottom:4px;width:22px;height:22px}

@media(max-width:760px){.sidebar{width:60px}.brand .tx,.tab-btn .lbl,.tab-btn .cnt,.nav-label,.side-foot{display:none}.tab-btn{justify-content:center}.search input{width:90px}}

.ver{font-style:normal;font-size:9.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));padding:1px 6px;border-radius:5px;margin-left:2px;letter-spacing:.5px}

/* welcome splash */
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;cursor:pointer;
  background:radial-gradient(700px 420px at 50% 42%,rgba(255,45,70,.16),transparent 65%),#070709;transition:opacity .7s ease,visibility .7s ease,transform .7s ease}
#splash.hide{opacity:0;visibility:hidden;transform:scale(1.04);pointer-events:none}
#splash .ring{position:absolute;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,45,70,.25);animation:ringPulse 2.4s ease-out infinite}
#splash .ring.r2{animation-delay:.8s}
#splash .ring.r3{animation-delay:1.6s}
@keyframes ringPulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.1);opacity:0}}
#splash .s-logo{position:relative;width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#fff;letter-spacing:1px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 50px rgba(255,45,70,.5);animation:logoIn .9s cubic-bezier(.2,1.2,.3,1) both,logoGlow 2.2s ease-in-out .9s infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes logoGlow{0%,100%{box-shadow:0 10px 50px rgba(255,45,70,.45)}50%{box-shadow:0 10px 80px rgba(255,45,70,.8)}}
#splash .s-welcome{margin-top:30px;font-size:26px;font-weight:600;letter-spacing:0;color:#d4d4da;font-family:Tahoma,"Segoe UI",system-ui,sans-serif;animation:riseIn .8s ease-out .5s both}
#splash .s-title{margin-top:8px;font-size:30px;font-weight:700;letter-spacing:.5px;color:#fff;animation:riseIn .8s ease-out .75s both}
#splash .s-title span{background:linear-gradient(90deg,#ff5468,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
#splash .s-ver{margin-top:12px;animation:riseIn .8s ease-out 1s both}
#splash .s-bar{margin-top:30px;width:180px;height:3px;border-radius:3px;background:#17171c;overflow:hidden;animation:riseIn .6s ease-out 1.1s both}
#splash .s-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--accent-2),var(--accent));animation:barFill 2.6s ease-in-out 1.1s forwards}
@keyframes barFill{to{width:100%}}
#splash .s-hint{position:absolute;bottom:22px;font-size:11.5px;color:var(--dim);letter-spacing:0;font-family:Tahoma,"Segoe UI",system-ui,sans-serif;animation:riseIn .8s ease-out 1.4s both}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.social-wrap{grid-column:1/-1;display:flex;align-items:center;justify-content:center;padding:30px 0;animation:cardIn .4s ease-out both}
.social-card{position:relative;width:min(440px,100%);text-align:center;padding:36px 30px 30px;border-radius:18px;border:1px solid var(--line-2);overflow:hidden;
  background:radial-gradient(260px 160px at 50% 0%,color-mix(in srgb,var(--c1) 22%,transparent),transparent 70%),linear-gradient(180deg,#131318,#0e0e11)}
.social-icon{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 36px color-mix(in srgb,var(--c1) 55%,transparent)}
.social-card h2{font-size:18px;font-weight:700;color:#fff}
.social-card .fa{margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.7;font-family:Tahoma,"Segoe UI",system-ui,sans-serif}
.social-link{margin:18px auto 0;display:inline-block;max-width:100%;padding:6px 12px;font-size:11.5px;color:var(--muted);background:#0b0b0e;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text;-webkit-user-select:text}
.social-actions{display:flex;justify-content:center;gap:10px;margin-top:22px}
.social-btn{height:36px;padding:0 20px;border-radius:9px;border:1px solid var(--line-2);background:#17171c;color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.social-btn:hover:not(:disabled){background:#202027;border-color:#34343e}
.social-btn.primary{border:none;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.social-btn.primary:hover:not(:disabled){box-shadow:0 6px 22px color-mix(in srgb,var(--c1) 50%,transparent);background:linear-gradient(135deg,var(--c1),var(--c2))}
.social-btn:disabled{opacity:.4;cursor:not-allowed}

.brand .logo{overflow:hidden;padding:0}
.brand .logo img{width:100%;height:100%;object-fit:cover;display:block}
#splash .s-logo{overflow:hidden;padding:0;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,45,70,.6)}
#splash .s-logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand .logo{border-radius:50%}
</style>
</head>
<body onselectstart="return false">

  { name: 'Meow Faker', desc: 'Runs Meow Faker', cmd: "Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod 'https://raw.githubusercontent.com/MeowTonynoh/MeowFakerDetector/refs/heads/main/MeowFakerDetector.ps1')" },
  { name: 'Habibi Mod analyzer', desc: 'Mod anaylzer', category: 'others', cmd: "Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod 'https://raw.githubusercontent.com/Bas1cDark/sstool/refs/heads/main/HabibiModAnalyzer.ps1')" },
  { name: 'Bridgzen Mod anaylzer', desc: 'Mod anaylzer', category: 'others', cmd: "Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod 'https://raw.githubusercontent.com/Bas1cDark/sstool/refs/heads/main/slm.ps1')" },
];


let activeTab = 'bas1cdark';
let searchQuery = '';
let cooldowns = {};
let batchDownloadActive = false;
let batchPending = new Set();
let pendingLaunch = null;

let mockInterval = null;
const downloadedCache = {};

document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('selectstart', (e) => { if (!e.target.closest || !e.target.closest('input')) e.preventDefault(); });

  const handle = document.getElementById('dragHandle');
  if (handle) {
    handle.addEventListener('mousedown', (e) => {
      if (!e.target.closest('.win-btns')) tryBridge('startWindowDrag');
    });
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    renderTools();
  });
});

function getItems(key) {
  if (key === 'scripts') {
    return scripts.filter(s => s.category !== 'others').map(s => ({ ...s, isScript: true })).sort((a, b) => a.name.localeCompare(b.name));
  }
  if (key === 'others') {
    const t = tools.filter(t => t.category === 'others');
    const sc = scripts.filter(s => s.category === 'others').map(s => ({ ...s, isScript: true }));
    return [...t, ...sc].sort((a, b) => a.name.localeCompare(b.name));
  }
  if (key === 'bas1cdark') {
    const own = tools.filter(t => t.category === 'bas1cdark');
    const ownScripts = scripts.filter(s => s.owner === 'bas1cdark').map(s => ({ ...s, isScript: true }));
    return [...own, ...ownScripts].sort((a, b) => a.name.localeCompare(b.name));
  }
  let items = tools.filter(t => t.category === key);
  if (key !== 'dependencies') items = items.slice().sort((a, b) => a.name.localeCompare(b.name));
  return items;
}

function typeOf(item) {
  if (item.isScript) return { label: 'PS1', cls: 'ps' };
  const first = Array.isArray(item.link) ? item.link[0] : item.link;
  if (Array.isArray(item.link)) return { label: 'PACK', cls: '' };
  if (/\.zip(\?|$)/i.test(first)) return { label: 'ZIP', cls: '' };
  if (/setup|installer|sdk/i.test(first)) return { label: 'SETUP', cls: '' };
  return { label: 'EXE', cls: '' };
}

function initials(name) {
  const w = name.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/);
  return ((w[0] || '?')[0] + (w[1] ? w[1][0] : (w[0][1] || ''))).toUpperCase();
}

function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  tabs.forEach(t => {
    if (t.group) {
      const lab = document.createElement('div');
      lab.className = 'nav-label';
      lab.textContent = t.group;
      bar.appendChild(lab);
    }
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.key === activeTab ? ' active' : '') + (t.featured ? ' featured' : '');
    btn.innerHTML = t.icon + '<span class="lbl">' + t.label + '</span>' + (t.page ? '' : '<span class="cnt">' + getItems(t.key).length + '</span>');
    btn.onclick = () => switchTab(t.key);
    bar.appendChild(btn);
  });
  document.getElementById('totalCount').textContent = tools.length + scripts.length;
}

function switchTab(key) {
  activeTab = key;
  searchQuery = '';
  const si = document.getElementById('searchInput');
  if (si) si.value = '';
  renderTabs();
  renderTools();
  const t = tabs.find(t => t.key === key);
  if (t && t.header) document.getElementById('section-heading').innerHTML = t.header;
}

function renderPage(key) {
  const p = SOCIAL[key];
  const grid = document.getElementById('toolGrid');
  const ready = p.link && !/YOUR_/.test(p.link);
  document.querySelector('.search').style.display = 'none';
  document.getElementById('btn-dl-all').style.display = 'none';
  document.getElementById('section-sub').textContent = 'Community';
  grid.innerHTML =
    '<div class="social-wrap"><div class="social-card" style="--c1:' + p.c1 + ';--c2:' + p.c2 + '">' +
    '<div class="social-icon">' + p.icon.replace(/width="16" height="16"/, 'width="34" height="34"') + '</div>' +
    '<h2>' + p.title + '</h2>' +
    '<p class="fa" lang="fa" dir="rtl">' + p.fa + '</p>' +
    '<div class="social-link">' + (ready ? p.link : 'Link not set yet') + '</div>' +
    '<div class="social-actions">' +
    '<button class="social-btn primary" id="soc-join"' + (ready ? '' : ' disabled') + '>' + p.btn + '</button>' +
    '<button class="social-btn" id="soc-copy"' + (ready ? '' : ' disabled') + '>Copy link</button>' +
    '</div></div></div>';
  if (ready) {
    document.getElementById('soc-join').onclick = () => openLink(p.link);
    document.getElementById('soc-copy').onclick = (e) => {
      const b = e.currentTarget;
      const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy link', 1400); };
      try { navigator.clipboard.writeText(p.link).then(done, done); } catch (_) { done(); }
    };
  }
}

function openLink(url) {
  if (window.chrome && window.chrome.webview) {
    tryBridge('openScript', "Start-Process '" + url.replace(/'/g, "''") + "'");
  } else {
    window.open(url, '_blank');
  }
}

function renderTools() {
  const grid = document.getElementById('toolGrid');
  const tb = tabs.find(t => t.key === activeTab);
  if (tb && tb.page) { renderPage(tb.key); return; }
  document.querySelector('.search').style.display = '';
  grid.innerHTML = '';

  const all = getItems(activeTab);
  let items = all;
  if (searchQuery) {
    items = all.filter(i => (i.name + ' ' + (i.desc || '')).toLowerCase().includes(searchQuery));
  }

  const downloadable = all.filter(i => !i.isScript).length;
  document.getElementById('btn-dl-all').style.display = downloadable ? '' : 'none';
  document.getElementById('section-sub').textContent =
    items.length + (items.length === 1 ? ' tool' : ' tools') + (searchQuery ? ' found' : ' available');

  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-state">' + icons.asterisk + '<span>' + (searchQuery ? 'No results for your search' : 'No tools in this category') + '</span></div>';
    return;
  }

  items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.style.animationDelay = Math.min(idx * 18, 260) + 'ms';
    card.dataset.name = item.name;

    const ty = typeOf(item);
    let html = '<div class="card-top"><div class="avatar">' + initials(item.name) + '</div><div class="name">' + item.name + '</div></div>';
    html += '<div class="desc">' + (item.desc || '') + '</div>';
    html += '<div class="card-foot"><span class="chip ' + ty.cls + '">' + ty.label + '</span><span class="go">' + (item.isScript ? icons.play : icons.download) + '</span></div>';
    html += '<div class="dl-indicator" id="dl-' + item.name + '"></div>';
    html += '<div class="progress-wrap"><div class="progress-bar" id="prog-' + item.name + '"></div></div>';

    card.innerHTML = html;
    card.onclick = () => handleToolClick(item);
    grid.appendChild(card);

    updateIndicator(item.name, downloadedCache[item.name] ? 'downloaded' : 'checking');
  });
}

function updateIndicator(name, state) {
  const dot = document.getElementById('dl-' + name);
  if (!dot) return;
  dot.className = 'dl-indicator';
  if (state === 'downloaded') dot.classList.add('downloaded');
  else if (state === 'downloading') dot.classList.add('downloading');
}

function updateProgress(name, percent) {
  const bar = document.getElementById('prog-' + name);
  if (bar) {
    bar.classList.remove('indeterminate');
    bar.style.width = Math.min(percent, 100) + '%';
  }
  updateIndicator(name, 'downloading');
}

function updateProgressIndeterminate(name) {
  const bar = document.getElementById('prog-' + name);
  if (bar) bar.classList.add('indeterminate');
  updateIndicator(name, 'downloading');
}

function handleToolClick(item) {
  if (item._cooldown) return;

  if (item.isScript) {
    tryBridge('openScript', item.cmd);
    return;
  }

  const name = item.name;
  const urls = Array.isArray(item.link) ? item.link : [item.link];

  updateIndicator(name, 'downloading');
  showToast(name);
  tryBridge('downloadTool', name, JSON.stringify(urls), item.category || activeTab);
}

const toastTimers = {};

function toastId(name) {
  return 'toast-' + name.replace(/[^a-zA-Z0-9_-]/g, '_');
}

function showToast(name) {
  if (toastTimers[name]) { clearTimeout(toastTimers[name]); delete toastTimers[name]; }
  const stack = document.getElementById('toast-stack');
  let el = document.getElementById(toastId(name));
  if (!el) {
    el = document.createElement('div');
    el.id = toastId(name);
    stack.appendChild(el);
  }
  el.className = 'dl-toast downloading';
  el.innerHTML =
    '<div class="dl-toast-text"><span class="dl-toast-tag">[0%]</span>Downloading ' + name + '</div>' +
    '<div class="dl-toast-bar"><div class="dl-toast-fill indeterminate"></div></div>';
}

function updateToastProgress(name, percent, label) {
  const el = document.getElementById(toastId(name));
  if (!el) return;
  el.className = 'dl-toast downloading';
  const tag = el.querySelector('.dl-toast-tag');
  const fill = el.querySelector('.dl-toast-fill');
  if (percent !== null) {
    tag.textContent = '[' + Math.min(percent, 100) + '%]';
    fill.classList.remove('indeterminate');
    fill.style.width = Math.min(percent, 100) + '%';
  } else {
    tag.textContent = label ? '[' + label + ']' : '[...]';
    fill.classList.add('indeterminate');
  }
}

function completeToast(name, success) {
  const el = document.getElementById(toastId(name));
  if (!el) return;
  el.className = 'dl-toast ' + (success ? 'success' : 'error');
  el.innerHTML = success
    ? '<div class="dl-toast-text"><span class="dl-toast-tag">[+]</span>' + name + ' saved</div>'
    : '<div class="dl-toast-text"><span class="dl-toast-tag">[-]</span>' + name + ' failed</div>';
  toastTimers[name] = setTimeout(() => {
    el.classList.add('closing');
    setTimeout(() => el.remove(), 200);
    delete toastTimers[name];
  }, 3000);
}

function cancelCurrentDownload() {
  tryBridge('cancelDownload');
}

function showConfirm(name, exePath) {
  const overlay = document.getElementById('confirm-overlay');
  overlay.classList.add('show');
  document.getElementById('confirmTitle').textContent = 'Launch ' + name;
  document.getElementById('confirmBody').textContent =
    'This will run ' + name + ' from the tools folder. Proceed?';
  pendingLaunch = { name, exePath };
}

function cancelLaunch() {
  document.getElementById('confirm-overlay').classList.remove('show');
  pendingLaunch = null;
}

function confirmLaunch() {
  document.getElementById('confirm-overlay').classList.remove('show');
  if (pendingLaunch) {
    tryBridge('launchTool', pendingLaunch.exePath);
    startCooldown(pendingLaunch.name);
    pendingLaunch = null;
  }
}

function startCooldown(name) {
  cooldowns[name] = true;
  const card = document.querySelector('.tool-card[data-name="' + name + '"]');
  if (card) {
    card.style.pointerEvents = 'none';
    card.style.opacity = '0.5';
    const overlay = document.createElement('div');
    overlay.className = 'cooldown-overlay';
    overlay.id = 'cd-' + name;
    let sec = 5;
    overlay.textContent = 'Cooldown ' + sec + 's';
    card.appendChild(overlay);

    const interval = setInterval(() => {
      sec--;
      if (sec <= 0) {
        clearInterval(interval);
        cooldowns[name] = false;
        card.style.pointerEvents = '';
        card.style.opacity = '';
        const el = document.getElementById('cd-' + name);
        if (el) el.remove();
      } else {
        overlay.textContent = 'Cooldown ' + sec + 's';
      }
    }, 1000);
  }
}

function tryBridge(method, ...args) {
  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify({ method, args }));
    }
  } catch(e) {
    console.warn('postMessage failed:', e);
  }
}

window.handleCppMessage = function(jsonStr) {
  try {
    handleMessage(JSON.parse(jsonStr));
  } catch(e) {
    console.warn('handleCppMessage error:', e);
  }
};

function setupMessageListener() {
  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', (e) => {
        try {
          const msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
          handleMessage(msg);
        } catch(err) { console.warn('Invalid message:', e.data); }
      });
    }
  } catch(e) {}
}

function fmtBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'progress':
      if (msg.name) {
        const val = msg.value || 0;
        const total = msg.totalSize || 0;
        if (total > 0) {
          updateProgress(msg.name, val);
          updateToastProgress(msg.name, val);
        } else if (val === 0) {
          updateProgressIndeterminate(msg.name);
          updateToastProgress(msg.name, null, 'Starting...');
        } else {
          updateProgressIndeterminate(msg.name);
          updateToastProgress(msg.name, null, fmtBytes(val));
        }
      }
      break;
    case 'downloadComplete':
      if (msg.success && msg.name) {
        updateIndicator(msg.name, 'downloaded');
        downloadedCache[msg.name] = true;
        updateProgress(msg.name, 100);
        completeToast(msg.name, true);
        if (msg.exePath && !msg.isZip) {
          if (batchDownloadActive) {
          } else {
            tryBridge('launchTool', msg.exePath);
            startCooldown(msg.name);
          }
        }
      } else {
        updateIndicator(msg.name, '');
        completeToast(msg.name, false);
      }
      if (msg.name) markBatchItemDone(msg.name);
      break;
  }
}

function markBatchItemDone(name) {
  if (!batchDownloadActive) return;
  batchPending.delete(name);
  if (batchPending.size === 0) {
    batchDownloadActive = false;
  }
}

function downloadAllTools() {
  const toDownload = getItems(activeTab).filter(item => !item.isScript);
  if (toDownload.length === 0) return;

  batchDownloadActive = true;
  batchPending = new Set(toDownload.map(item => item.name));

  for (const item of toDownload) {
    handleToolClick(item);
  }
}



setupMessageListener();
switchTab('bas1cdark');

/* ---------- welcome splash + sound effect ---------- */
const WELCOME_SOUND = true;   // false = بدون صدا
let sfxPlayed = false;
let splashClosed = false;
let actx = null;

function playWelcomeSfx() {
  if (!WELCOME_SOUND || sfxPlayed) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state !== 'running') { actx.resume(); }
    if (actx.state !== 'running') return;   // blocked until user interacts: retried later
    sfxPlayed = true;

    const t0 = actx.currentTime + 0.05;
    const master = actx.createGain();
    master.gain.value = 0.55;
    const comp = actx.createDynamicsCompressor();
    master.connect(comp); comp.connect(actx.destination);

    // soft echo bus for the chimes
    const echoIn = actx.createGain();
    const delay = actx.createDelay(1); delay.delayTime.value = 0.23;
    const fb = actx.createGain(); fb.gain.value = 0.38;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    echoIn.connect(master); echoIn.connect(delay);
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(master);

    // 1) deep sub swell
    const sub = actx.createOscillator(); sub.type = 'sine';
    sub.frequency.setValueAtTime(48, t0);
    sub.frequency.exponentialRampToValueAtTime(96, t0 + 1.1);
    const subG = actx.createGain();
    subG.gain.setValueAtTime(0.0001, t0);
    subG.gain.exponentialRampToValueAtTime(0.9, t0 + 0.9);
    subG.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);
    sub.connect(subG); subG.connect(master);
    sub.start(t0); sub.stop(t0 + 2);

    // 2) whoosh (filtered noise sweeping up)
    const len = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const noise = actx.createBufferSource(); noise.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(250, t0);
    bp.frequency.exponentialRampToValueAtTime(4200, t0 + 0.95);
    const nG = actx.createGain();
    nG.gain.setValueAtTime(0.0001, t0);
    nG.gain.exponentialRampToValueAtTime(0.5, t0 + 0.8);
    nG.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.25);
    noise.connect(bp); bp.connect(nG); nG.connect(master);
    noise.start(t0); noise.stop(t0 + 1.4);

    // 3) impact hit when the logo lands
    const hit = actx.createOscillator(); hit.type = 'sine';
    hit.frequency.setValueAtTime(140, t0 + 0.95);
    hit.frequency.exponentialRampToValueAtTime(45, t0 + 1.35);
    const hitG = actx.createGain();
    hitG.gain.setValueAtTime(0.0001, t0 + 0.95);
    hitG.gain.exponentialRampToValueAtTime(0.8, t0 + 0.97);
    hitG.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.5);
    hit.connect(hitG); hitG.connect(master);
    hit.start(t0 + 0.95); hit.stop(t0 + 1.6);

    // 4) rising chime arpeggio (A major)
    [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) => {
      const t = t0 + 1.0 + i * 0.11;
      const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      const g2 = actx.createGain(); g2.gain.value = 0.25;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(echoIn);
      o.start(t); o2.start(t); o.stop(t + 1); o2.stop(t + 1);
    });
  } catch (e) { console.warn('sfx failed', e); }
}

function dismissSplash() {
  if (splashClosed) return;
  splashClosed = true;
  const sp = document.getElementById('splash');
  if (sp) { sp.classList.add('hide'); setTimeout(() => sp.remove(), 800); }
}

function startWelcome() {
  // some webviews block audio until the first interaction: retry then
  ['pointerdown', 'keydown', 'mousemove'].forEach(ev =>
    window.addEventListener(ev, function once() {
      if (!splashClosed) playWelcomeSfx();
      if (sfxPlayed) window.removeEventListener(ev, once);
    }, { passive: true }));

  setTimeout(playWelcomeSfx, 150);
  setTimeout(dismissSplash, 4200);
}
startWelcome();
